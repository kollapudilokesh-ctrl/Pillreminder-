
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PillReminder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 3px 12px #00000010;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .medicine {
      background: #eff6ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .medicine h3 {
      margin: 0 0 8px;
    }

    .medicine p {
      margin: 5px 0;
    }

    .taken {
      background: #16a34a;
    }

    .delete {
      background: #dc2626;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      color: #475569;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>💊 PillReminder</h1>
    <p class="subtitle">Your daily medicine reminder</p>

    <div class="panel">
      <h2>Add Medicine</h2>

      <input
        type="text"
        id="medicineName"
        placeholder="Enter medicine name"
      >

      <label for="medicineTime">Reminder time:</label>
      <input type="time" id="medicineTime">

      <button onclick="addMedicine()">
        Add Medicine
      </button>

      <p id="message"></p>
    </div>

    <div class="panel">
      <h2>My Medicines</h2>
      <div id="medicineList"></div>
    </div>

  </div>

  <script type="module">
    import { LocalNotifications } from
      '@capacitor/local-notifications';

    import { Capacitor } from
      '@capacitor/core';

    const STORAGE_KEY = 'pillReminderMedicines';

    let medicines = [];

    try {
      medicines = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || '[]'
      );
    } catch {
      medicines = [];
    }

    function saveMedicines() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(medicines)
      );
    }

    function showMessage(message) {
      document.getElementById('message').textContent = message;
    }

    async function getNotificationPermission() {
      if (!Capacitor.isNativePlatform()) {
        return false;
      }

      let permission =
        await LocalNotifications.checkPermissions();

      if (permission.display !== 'granted') {
        permission =
          await LocalNotifications.requestPermissions();
      }

      return permission.display === 'granted';
    }

    async function scheduleReminder(medicine) {
      if (!Capacitor.isNativePlatform()) {
        return false;
      }

      const allowed = await getNotificationPermission();

      if (!allowed) {
        return false;
      }

      const [hour, minute] = medicine.time
        .split(':')
        .map(Number);

      await LocalNotifications.schedule({
        notifications: [
          {
            id: medicine.id,
            title: '💊 Time for your medicine',
            body: 'Reminder: ' + medicine.name,
            schedule: {
              on: {
                hour: hour,
                minute: minute
              },
              allowWhileIdle: true
            }
          }
        ]
      });

      return true;
    }

    async function cancelReminder(id) {
      if (!Capacitor.isNativePlatform()) {
        return;
      }

      try {
        await LocalNotifications.cancel({
          notifications: [{ id: id }]
        });
      } catch (error) {
        console.error('Could not cancel reminder:', error);
      }
    }

    async function addMedicine() {
      const name = document
        .getElementById('medicineName')
        .value.trim();

      const time = document
        .getElementById('medicineTime')
        .value;

      if (!name || !time) {
        showMessage('Please enter medicine name and time.');
        return;
      }

      let id;

      do {
        id = Math.floor(Math.random() * 2000000000) + 1;
      } while (medicines.some(m => m.id === id));

      const medicine = {
        id: id,
        name: name,
        time: time,
        takenDate: ''
      };

      medicines.push(medicine);
      saveMedicines();
      displayMedicines();

      document.getElementById('medicineName').value = '';
      document.getElementById('medicineTime').value = '';

      try {
        const scheduled = await scheduleReminder(medicine);

        if (scheduled) {
          showMessage('Medicine added and daily reminder scheduled!');
        } else if (Capacitor.isNativePlatform()) {
          showMessage('Medicine saved, but notification permission was not granted.');
        } else {
          showMessage('Medicine saved. Install the Android app for notifications.');
        }
      } catch (error) {
        console.error(error);
        showMessage('Medicine saved, but reminder could not be scheduled.');
      }
    }

    function markTaken(id) {
      const medicine = medicines.find(m => m.id === id);

      if (!medicine) return;

      medicine.takenDate = new Date().toDateString();

      saveMedicines();
      displayMedicines();
    }

    async function deleteMedicine(id) {
      await cancelReminder(id);

      medicines = medicines.filter(m => m.id !== id);

      saveMedicines();
      displayMedicines();

      showMessage('Medicine and its reminder deleted.');
    }

    function displayMedicines() {
      const list = document.getElementById('medicineList');

      list.innerHTML = '';

      if (medicines.length === 0) {
        list.innerHTML = '<p>No medicines added yet.</p>';
        return;
      }

      medicines.forEach(medicine => {
        const card = document.createElement('div');
        card.className = 'medicine';

        const heading = document.createElement('h3');
        heading.textContent = '💊 ' + medicine.name;

        const time = document.createElement('p');
        time.textContent = '⏰ ' + medicine.time;

        const status = document.createElement('p');

        const takenToday =
          medicine.takenDate === new Date().toDateString();

        status.textContent = takenToday
          ? 'Status: Taken today'
          : 'Status: Not taken today';

        const takenButton = document.createElement('button');
        takenButton.className = 'taken';
        takenButton.textContent = takenToday
          ? 'Taken'
          : 'Mark as Taken';

        takenButton.disabled = takenToday;
        takenButton.onclick = () => markTaken(medicine.id);

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete';
        deleteButton.textContent = 'Delete';
        deleteButton.onclick = () => deleteMedicine(medicine.id);

        card.append(
          heading,
          time,
          status,
          takenButton,
          deleteButton
        );

        list.appendChild(card);
      });
    }

    displayMedicines();

  </script>
</body>
</html>
