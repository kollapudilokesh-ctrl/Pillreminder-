
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pill Reminder</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 12px;
    }

    .add {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    .taken {
      background: #16a34a;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .medicine {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .medicine h3 {
      margin: 0 0 8px;
    }

    .message {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: #eff6ff;
      overflow-wrap: anywhere;
    }

    .small {
      color: #64748b;
      font-size: 13px;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💊 Pill Reminder</h1>

    <label for="medicineName">Medicine name</label>
    <input
      id="medicineName"
      type="text"
      placeholder="Enter medicine name"
    >

    <label for="medicineTime">Reminder time</label>
    <input id="medicineTime" type="time">

    <button class="add" id="addButton">
      Add Daily Reminder
    </button>

    <div id="message" class="message">
      Add a medicine and its reminder time.
    </div>

    <h2>My Medicines</h2>
    <div id="medicineList"></div>

    <p class="small">
      Reminders are scheduled on this device.
    </p>
  </div>

  <script type="module">
    import { Capacitor } from '@capacitor/core';
    import { LocalNotifications } from '@capacitor/local-notifications';

    const nameInput = document.getElementById('medicineName');
    const timeInput = document.getElementById('medicineTime');
    const addButton = document.getElementById('addButton');
    const medicineList = document.getElementById('medicineList');
    const message = document.getElementById('message');

    let medicines = [];

    try {
      medicines = JSON.parse(
        localStorage.getItem('pillMedicines') || '[]'
      );
    } catch {
      medicines = [];
    }

    function showMessage(text) {
      message.textContent = text;
    }

    function saveMedicines() {
      localStorage.setItem(
        'pillMedicines',
        JSON.stringify(medicines)
      );
    }

    async function getPermission() {
      if (!Capacitor.isNativePlatform()) {
        throw new Error(
          'Open this app from its installed Android APK.'
        );
      }

      let permission =
        await LocalNotifications.checkPermissions();

      if (permission.display !== 'granted') {
        permission =
          await LocalNotifications.requestPermissions();
      }

      if (permission.display !== 'granted') {
        throw new Error(
          'Notification permission was not granted.'
        );
      }

      let exact =
        await LocalNotifications.checkExactNotificationSetting();

      if (exact.exact_alarm !== 'granted') {
        exact =
          await LocalNotifications.changeExactNotificationSetting();
      }

      if (exact.exact_alarm !== 'granted') {
        throw new Error(
          'Exact alarm permission is not enabled. Enable it in Android settings.'
        );
      }
    }

    async function scheduleReminder(medicine) {
      await getPermission();

      const [hour, minute] =
        medicine.time.split(':').map(Number);

      await LocalNotifications.schedule({
        notifications: [
          {
            id: medicine.id,
            title: '💊 Medicine Reminder',
            body: 'It is time for: ' + medicine.name,
            schedule: {
              on: {
                hour: hour,
                minute: minute
              },
              allowWhileIdle: true
            }
          }
        ]
      });
    }

    async function addMedicine() {
      const name = nameInput.value.trim();
      const time = timeInput.value;

      if (!name || !time) {
        showMessage('Please enter the medicine name and time.');
        return;
      }

      const medicine = {
        id: Math.floor(Date.now() % 2000000000),
        name: name,
        time: time,
        taken: false
      };

      medicines.push(medicine);
      saveMedicines();
      renderMedicines();

      try {
        showMessage('Requesting notification permissions...');

        await scheduleReminder(medicine);

        showMessage(
          'Daily reminder scheduled for ' + name + ' at ' + time
        );

        nameInput.value = '';
        timeInput.value = '';

      } catch (error) {
        console.error('Reminder error:', error);

        showMessage(
          'Medicine saved, but reminder failed: ' +
          (error?.message || String(error))
        );
      }
    }

    async function deleteMedicine(id) {
      try {
        await LocalNotifications.cancel({
          notifications: [{ id: id }]
        });
      } catch (error) {
        console.error('Cancel error:', error);
      }

      medicines = medicines.filter(
        medicine => medicine.id !== id
      );

      saveMedicines();
      renderMedicines();
      showMessage('Medicine deleted.');
    }

    function markTaken(id) {
      const medicine = medicines.find(
        item => item.id === id
      );

      if (medicine) {
        medicine.taken = !medicine.taken;
        saveMedicines();
        renderMedicines();
      }
    }

    function renderMedicines() {
      medicineList.innerHTML = '';

      if (medicines.length === 0) {
        medicineList.textContent = 'No medicines added yet.';
        return;
      }

      medicines.forEach(medicine => {
        const card = document.createElement('div');
        card.className = 'medicine';

        const heading = document.createElement('h3');
        heading.textContent = medicine.name;

        const time = document.createElement('p');
        time.textContent = 'Time: ' + medicine.time;

        const status = document.createElement('p');
        status.textContent = medicine.taken
          ? 'Status: Taken'
          : 'Status: Not marked as taken';

        const takenButton = document.createElement('button');
        takenButton.className = 'taken';
        takenButton.textContent = medicine.taken
          ? 'Undo'
          : 'Mark as Taken';

        takenButton.addEventListener('click', () => {
          markTaken(medicine.id);
        });

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete';
        deleteButton.textContent = 'Delete';

        deleteButton.addEventListener('click', () => {
          deleteMedicine(medicine.id);
        });

        card.append(
          heading,
          time,
          status,
          takenButton,
          deleteButton
        );

        medicineList.appendChild(card);
      });
    }

    addButton.addEventListener('click', addMedicine);

    renderMedicines();
  </script>
</body>
</html>
